<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Esteloteca
        {% endblock %}
    </title>


    <!-- PWA -->
    <link
        rel="manifest"
        href="/static/manifest.json"
    >

    <meta
        name="theme-color"
        content="#2f2a27"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="/static/icons/icon-192.png"
    >


    <!-- CSS -->
    <link
        rel="stylesheet"
        href="/static/css/styles.css"
    >


    {% block extra_head %}
    {% endblock %}

</head>


<body>

    {% block content %}
    {% endblock %}


    <!-- Registro del Service Worker -->
    <script
        src="/static/js/register-sw.js"
        defer
    ></script>

</body>

</html>
