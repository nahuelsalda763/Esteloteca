{% extends "base.html" %}

{% block title %}
    {{ titulo }} | Esteloteca
{% endblock %}
{% block content %}

<main class="error-contenedor">
    <p class="error-codigo">
        Error {{ status_code }}
    </p>

    <h1>
        {{ titulo }}
    </h1>
    <p class="error-mensaje">
        {{ mensaje }}
    </p>
    <a class="boton" href="/">
        Volver a la colección
    </a>

</main>

{% endblock %}
