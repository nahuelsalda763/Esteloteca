<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sin conexión | Esteloteca</title>

    <meta
        name="theme-color"
        content="#2f2a27"
    >

    <link
        rel="icon"
        type="image/png"
        href="/static/icons/icon-192.png"
    >

    <link
        rel="stylesheet"
        href="/static/css/styles.css"
    >
</head>

<body>

    <main class="offline-contenedor">

        <img
            class="offline-logo"
            src="/static/icons/icon-192.png"
            alt="Logo de Esteloteca"
        >

        <h1>
            Esteloteca
        </h1>

        <h2>
            Sin conexión
        </h2>

        <p>
            No se pudo conectar con el servidor.
        </p>

        <p>
            Cuando la conexión vuelva a estar disponible,
            podrás continuar viendo tu colección.
        </p>

        <button
            class="boton"
            type="button"
            onclick="window.location.reload()"
        >
            Intentar nuevamente
        </button>

    </main>

</body>

</html>
